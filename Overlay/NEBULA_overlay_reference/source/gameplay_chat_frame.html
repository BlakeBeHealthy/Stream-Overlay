<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NEBULA — gameplay chat frame</title>
<style>
@font-face { font-family: 'Iceberg'; src: url('../assets/fonts/iceberg-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; src: url('../assets/fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2'); font-weight: 500; }
:root {
  --accent: #39FF88; --accent-light: hsl(145, 100%, 80%);
  --purple: hsl(286, 90%, 59%); --yellow: hsl(54, 100%, 55%);
  --white: #FFFFFF; --muted: #9FB8A8; --base: #0A0D0B;
}
/* OBS needs to see through everything that isn't the overlay */
html, body { margin: 0; background: transparent; overflow: hidden; }
body { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>

<!-- Browser source size: 420 x 276. Put the chat source ON TOP of this, inside the box: (36, 54) to (390, 248). -->
<svg width="420" height="276" viewBox="0 0 420 276" style="display:block">
  <g transform="translate(18,18)">
    <polygon points="0,0 364,0 384,20 384,240 20,240 0,220" fill="rgba(10,13,11,0.55)" stroke="#39FF88" stroke-width="1.5"/>
    <polygon points="0,0 180,0 176,-6 0,-6" fill="#39FF88"/>
    <circle cx="20" cy="240" r="3.5" fill="#39FF88"/>
    <path d="M392,26 V-8 H358 M-8,214 V248 H26" fill="none" stroke="hsl(286, 90%, 59%)" stroke-width="3"/>
    <text x="16" y="22" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="3" fill="hsl(54, 100%, 55%)">// CHAT</text>
    <text x="368" y="22" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing="1.5" fill="#9FB8A8">TW · YT · KICK</text>
    <line x1="16" y1="30" x2="368" y2="30" stroke="#39FF88" stroke-opacity=".35"/>
  </g>
</svg>
</body>
</html>
